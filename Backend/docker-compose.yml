# Compatível com Docker Compose e podman-compose (Fedora)
# Para subir: podman-compose up -d
# Para parar: podman-compose down

services:
  postgres:
    image: docker.io/postgres:16-alpine
    container_name: helpdesk_db
    environment:
      POSTGRES_USER: helpdesk
      POSTGRES_PASSWORD: helpdesk
      POSTGRES_DB: helpdesk
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - helpdesk_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helpdesk -d helpdesk"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  helpdesk_pgdata:
